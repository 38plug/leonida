<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="VICE City">
  <defs>
    <linearGradient id="viceFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F55E0"/>
      <stop offset="35%" stop-color="#C218A0"/>
      <stop offset="62%" stop-color="#FF3D8A"/>
      <stop offset="100%" stop-color="#F0A22A"/>
    </linearGradient>
    <linearGradient id="viceStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#F6C24A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1030" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 3D extrusion layers -->
  <g font-family="Arial Black, Helvetica Neue, Impact, sans-serif" font-size="210" font-weight="900" letter-spacing="-6" text-anchor="middle">
    <g transform="translate(458,268) skewX(-10)">
      <text x="18" y="22" fill="#2A1548">VICE</text>
      <text x="15" y="18" fill="#321A52">VICE</text>
      <text x="12" y="14" fill="#3A1F5C">VICE</text>
      <text x="9" y="10" fill="#422466">VICE</text>
      <text x="6" y="6" fill="#4A2A70">VICE</text>
    </g>
    <!-- face -->
    <g transform="translate(450,260) skewX(-10)" filter="url(#softGlow)">
      <text x="0" y="0" fill="url(#viceFace)" stroke="url(#viceStroke)" stroke-width="4" paint-order="stroke fill">VICE</text>
    </g>
  </g>

  <!-- Script City -->
  <text x="470" y="255" text-anchor="middle"
        font-family="Georgia, 'Brush Script MT', cursive" font-size="118" font-style="italic" font-weight="700"
        fill="#FFFFFF" style="letter-spacing:1px">
    City
  </text>
</svg>
